<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atualizando o app</title>
<style>
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(165deg,#00541f,#007a30 45%,#00a844);color:#fff;text-align:center;padding:24px}
.box{max-width:340px}
h1{font-size:1.5rem;margin:0 0 10px}
p{opacity:.92;line-height:1.5;margin:0 0 6px}
a{display:inline-block;margin-top:18px;background:#fff;color:#007a30;font-weight:800;padding:14px 26px;border-radius:99px;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h1>Atualizando o app...</h1>
<p id="m">Limpando as cópias antigas guardadas neste aparelho.</p>
<a id="go" href="./" hidden>Abrir o app</a>
</div>
<script>
(async function(){
  var m=document.getElementById("m"),go=document.getElementById("go");
  try{var rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(function(r){return r.unregister()}))}catch(e){}
  try{var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k)}))}catch(e){}
  m.textContent="Pronto! Abrindo o app na versão mais nova.";
  go.hidden=false;
  setTimeout(function(){location.replace("./?v="+Date.now())},1200);
})();
</script>
</body>
</html>
