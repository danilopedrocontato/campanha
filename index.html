async function cepInfo(c){try{var r=await fetch("https://brasilapi.com.br/api/cep/v2/"+c);if(!r.ok)return null;return await r.json()}catch(e){return null}}
async function geoOne(l){
  var end=String(l.endereco||"").replace(/^r\.?\s+/i,"Rua ").replace(/^av\.?\s+/i,"Avenida ").replace(/^trav\.?\s+/i,"Travessa ").replace(/^al\.?\s+/i,"Alameda ").replace(/^est\.?\s+/i,"Estrada ").replace(/^rod\.?\s+/i,"Rodovia ").replace(/\bn[º°o]\.?\s*(?=\d)/gi,"").trim();
  var bai=String(l.bairro||"").trim(),cm=end.match(/\b(\d{5})-?(\d{3})\b/),cep=cm?cm[1]+cm[2]:"";
  if(cm)end=end.replace(cm[0],"").replace(/[,\s-]+$/,"").trim();
  var cid=l.cidade||"Betim",uf=l.estado||"MG",sn=UFS[uf]||uf,loc=", "+cid+", "+uf+", Brasil";
  var rua=end.split(",")[0].replace(/\s+\d+\S*$/,"").trim(),nm=(end.replace(rua,"").match(/\b(\d{1,5})\b/)||[])[1]||"";
  var enc=encodeURIComponent,base="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&",st="&city="+enc(cid)+"&state="+enc(sn);
  var hit=async function(qs){try{var r=await fetch(base+qs),j=await r.json();return j&&j[0]?{lat:+j[0].lat,lng:+j[0].lon}:null}catch(e){return null}};
  var r;
  if(rua){
    r=await hit("street="+enc((nm?nm+" ":"")+rua)+st);if(r)return{lat:r.lat,lng:r.lng,aprox:false};await pause(1100);
    r=await hit("q="+enc(end+(bai?", "+bai:"")+loc));if(r)return{lat:r.lat,lng:r.lng,aprox:false};await pause(1100)}
  if(cep){var ci=await cepInfo(cep),c=ci&&ci.location&&ci.location.coordinates;
    if(c&&c.latitude!=null&&c.longitude!=null)return{lat:+c.latitude,lng:+c.longitude,aprox:true};
    if(ci&&ci.street){r=await hit("q="+enc(ci.street+", "+(ci.neighborhood||bai)+loc));if(r)return{lat:r.lat,lng:r.lng,aprox:true};await pause(1100)}}
  if(rua){r=await hit("street="+enc(rua)+st);if(r)return{lat:r.lat,lng:r.lng,aprox:true};await pause(1100)}
  if(bai){r=await hit("q="+enc(bai+loc));if(r)return{lat:r.lat,lng:r.lng,aprox:true}}
  return null}
async function geocodeAll(){

function importar(f){
  if(!f)return;var ext=f.name.split(".").pop().toLowerCase();
  f.arrayBuffer().then(async function(buf){
    var rows,ws;
    if(ext==="xlsx"||ext==="xls"){
      if(!window.XLSX){impMsg="A leitura de .xlsx não carregou. Salve como .csv e tente de novo.";return render()}
      var wb=XLSX.read(buf,{type:"array"});ws=wb.Sheets[wb.SheetNames[0]]}
    else{var t;try{t=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){t=new TextDecoder("windows-1252").decode(buf)}
      t=t.replace(/^\uFEFF/,"");
      if(window.XLSX){var w2=XLSX.read(t,{type:"string"});ws=w2.Sheets[w2.SheetNames[0]]}
      else rows=t.split(/\r?\n/).filter(Boolean).map(function(l){return l.split(l.indexOf(";")>-1?";":",")})}
    if(ws)rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
    var A={nome:"nome",local:"nome",eleitor:"nome",tipo:"tipo",categoria:"tipo",estado:"estado",uf:"estado",cidade:"cidade",municipio:"cidade",regional:"regional",regiao:"regional",bairro:"bairro",endereco:"endereco",rua:"endereco",logradouro:"endereco",lat:"lat",latitude:"lat",lng:"lng",lon:"lng",long:"lng",longitude:"lng",coordenadas:"coord",coordenada:"coord",coords:"coord",contato:"contato",telefone:"contato",tel:"contato",whatsapp:"contato",fone:"contato",celular:"contato",obs:"obs",observacao:"obs",observacoes:"obs"};
    var hd=(rows[0]||[]).map(function(h){return A[nrm(h)]||""});
    if(hd.indexOf("nome")<0){impMsg='Não encontrei a coluna "nome" na primeira linha da planilha.';return render()}
    var arr=[],sem=0;
    rows.slice(1).forEach(function(r){
      var o={};hd.forEach(function(k,i){if(k)o[k]=String(r[i]==null?"":r[i]).trim()});if(!o.nome)return;
      var a=num(o.lat),b=num(o.lng),ll=okLL(a,b)?[a,b]:parseLL(o.coord);
      var tp=Object.keys(TIPOS).filter(function(t){return nrm(t)===nrm(o.tipo||"")})[0]||(o.tipo?"Outro":"Eleitor a visitar");
      var d=completa({nome:o.nome,tipo:tp,estado:o.estado,cidade:o.cidade,regional:regFrom(o.regional)||o.regional||"",bairro:o.bairro||"",endereco:o.endereco||"",lat:ll?ll[0]:null,lng:ll?ll[1]:null,contato:o.contato||"",obs:o.obs||""});
      d.aprox=false;d.geofail=false;d.criado_por=ME.id;d.criado_em=Date.now();arr.push(d);if(!ll)sem++});
    try{for(var i=0;i<arr.length;i+=400){var bt=db.batch();arr.slice(i,i+400).forEach(function(d){bt.set(col("locais").doc(),d)});await bt.commit()}}
    catch(e){impMsg="Erro ao salvar: "+errMsg(e);return render()}
    await loadAll();impMsg=arr.length+" itens importados"+(sem?". Localizando "+sem+" endereços no mapa...":".");render();geocodeAll()
  }).catch(function(){impMsg="Não consegui ler esse arquivo.";render()})}

/* ---------- ligações da tela ---------- */
function bindAll(){
  var q=function(id){return document.getElementById(id)},on=function(s,fn){document.querySelectorAll(s).forEach(fn)};
  bindMap();
  on("[data-go]",function(b){b.onclick=function(){tab=b.dataset.go;focusBusca=!!b.dataset.focus;render();scrollTo(0,0)}});
  on("[data-per]",function(b){b.onclick=function(){per=b.dataset.per;render()}});
  on("[data-sub]",function(b){b.onclick=function(){sub=b.dataset.sub;render()}});
  on("[data-f]",function(s){s.onchange=function(){var o=["uf","cid","reg","bai"],i=o.indexOf(s.dataset.f);F[o[i]]=s.value;for(var j=i+1;j<4;j++)F[o[j]]="";render()}});
  var bq=q("bq");if(bq){bq.oninput=function(){var t=fold(bq.value).split(/\s+/).filter(Boolean);on(".item[data-q]",function(it){var x=it.dataset.q;it.hidden=!t.every(function(k){return x.indexOf(k)>=0})})};if(focusBusca){focusBusca=false;bq.focus()}}
  on("[data-reg]",function(b){b.onclick=function(){preEleitor=b.dataset.reg;tab="visitas";render();scrollTo(0,0)}});
  on("[data-map]",function(b){b.onclick=function(){selLoc=b.dataset.map;tab="mapa";render();scrollTo(0,0)}});
  on("[data-edit]",function(b){b.onclick=function(){editLocal(b.dataset.edit)}});
  on("[data-share]",function(b){b.onclick=function(){var m=S.materiais.find(function(x){return x.id===b.dataset.share});if(m)compartilhar(m)}});
  on("[data-delm]",function(b){b.onclick=function(){if(confirm("Remover este material para toda a equipe?"))dbDo(col("materiais").doc(b.dataset.delm).delete(),"Material removido")}});
  on("[data-delv]",function(b){b.onclick=function(){if(confirm("Excluir este registro de visita? O eleitor volta para a lista de visitas pendentes."))dbDo(col("visitas").doc(b.dataset.delv).delete())}});
  on("[data-dell]",function(b){b.onclick=function(){if(confirm("Remover este item?"))dbDo(col("locais").doc(b.dataset.dell).delete())}});
  on("[data-pap]",function(b){b.onclick=function(){dbDo(col("perfis").doc(b.dataset.uid).update({papel:b.dataset.pap}),"Acesso atualizado")}});
  on("[data-areas]",function(b){b.onclick=function(){sheetAreas(b.dataset.areas)}});
  if(q("nm"))q("nm").onclick=sheetMaterial;
  if(q("ecamp"))q("ecamp").onclick=sheetCampanha;
  if(q("sv"))q("sv").onclick=salvarVisita;
  if(q("sl"))q("sl").onclick=salvarLocal;
  if(q("geo"))q("geo").onclick=async function(){
    if(!isCoord()){toast("Só o coordenador localiza endereços");return}
    var b=db.batch();S.locais.filter(function(l){return l.geofail}).forEach(function(l){b.update(col("locais").doc(l.id),{geofail:false})});
    try{await b.commit()}catch(e){toast(errMsg(e));return}await loadAll();geocodeAll()};
  if(q("lf"))q("lf").onchange=function(){impMsg="";importar(this.files[0])};
  if(q("lx"))q("lx").onclick=function(){if(confirm("Remover TODOS os locais e eleitores para todos os usuários?")){selLoc=null;dbDo(delTodos())}};
  if(q("shr2"))q("shr2").onclick=indicar;
  if(q("inst")){q("inst").hidden=!dpr;q("inst").onclick=function(){if(dpr){dpr.prompt();dpr=null;q("inst").hidden=true}}}
  if(q("pn"))q("pn").onclick=function(){var n=q("pnome").value.trim();if(!n){toast("Informe seu nome");return}
    dbDo(col("perfis").doc(ME.id).update({nome:n}),"Nome atualizado").then(async function(ok){if(ok){await loadMe();render()}})};
  if(q("pf"))q("pf").onchange=function(){var f=this.files[0];if(!f)return;
    imgData(f,160,.8,true,function(d){dbDo(col("perfis").doc(ME.id).update({foto:d}),"Foto atualizada").then(async function(ok){if(ok){await loadMe();render()}})})};
  if(q("out"))q("out").onclick=sair}
function render(){
  var nv=document.querySelector("nav");hdr();
  if(!liberado()){nv.hidden=true;return gate()}
  nv.hidden=false;document.body.classList.toggle("cabo",!isCoord());tabs();
  $("#app").innerHTML=tab==="painel"?viewPainel():tab==="mapa"?viewMapa():tab==="visitas"?viewVisitas():tab==="locais"?viewLocais():viewEquipe();
  bindAll()}
async function boot(){
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
  $("#shr").onclick=indicar;$("#av").onclick=function(){if(ME){tab="equipe";render();scrollTo(0,0)}};
  if(!window.firebase){document.querySelector("nav").hidden=true;$("#app").innerHTML='<h1>Sem conexão</h1><p class="sub">Não consegui carregar o Firebase. Verifique a internet e recarregue.</p>';return}
  firebase.initializeApp(CFG);fa=firebase.auth();db=firebase.firestore();
  await new Promise(function(res){var un=fa.onAuthStateChanged(function(){un();res()})});
  try{await loadMe();await loadAll();await fixAreas()}catch(e){toast(errMsg(e))}
  render()}
boot();
</script>
</body>
