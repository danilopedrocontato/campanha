var REGS=[["Alterosas",-19.995,-44.235],["Centro",-19.968,-44.198],["Citrolândia",-20.045,-44.215],["Icaivera",-19.960,-44.235],["Imbiruçu",-19.945,-44.255],["Norte",-19.940,-44.200],["Petrovale",-20.010,-44.190],["PTB",-19.995,-44.170],["Teresópolis",-19.982,-44.214],["Vianópolis",-19.950,-44.165]];
var COL=["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#1fa7c9","#d02fc0","#b59b00","#2f8f86","#9a6324"],RM=140,GB=null;
var KW={"Alterosas":["alterosa"],"Centro":["=centro"],"Citrolândia":["citrolandia"],"Icaivera":["icaivera"],"Imbiruçu":["imbirucu","imbiruss","jardimcalifornia","laranjeiras","jardimsantacruz","celsoalvespedrosa","saocristovao","pintos"],"Norte":["belavista","tiradentes","reservadamata","senhoradasgracas","viladasflores","granroyalle","santalucia","angola"],"Petrovale":["petrovale","joaoleite","jardimmontreal","jardimnazareno","recantodalagoa","donagraziela","estanciadosereno"],"PTB":["ptb","guanabara","camposeliseos","palmeiras","donaizabel","paulocamilo","vilaverde","pintados","presidentekennedy","granjadascandeias"],"Teresópolis":["teresopolis"],"Vianópolis":["vianopolis"]};
function nrm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"")}
function regFrom(v){var n=nrm(v);if(!n)return "";var r=REGS.filter(function(x){var m=nrm(x[0]);return m===n||m===n+"s"||m+"s"===n})[0];return r?r[0]:""}
function regOf(l){
  if(l.regional)return l.regional;
  var b=nrm(l.bairro),i,j,k,ks;
  if(b)for(i=0;i<REGS.length;i++){ks=KW[REGS[i][0]]||[];for(j=0;j<ks.length;j++){k=ks[j];if(k[0]==="="?b===k.slice(1):b.indexOf(k)>=0)return REGS[i][0]}}
  if(hasLL(l)){var c=Math.cos(l.lat*Math.PI/180),bd=1e9,bn="";REGS.forEach(function(r){var d=Math.pow(l.lat-r[1],2)+Math.pow((l.lng-r[2])*c,2);if(d<bd){bd=d;bn=r[0]}});if(bd<0.0049)return bn}
  return ""}
var LM=null,regFilter="",geoBusy=false;
function waUrl(l){var d=String(l.contato||"").replace(/\D/g,"");if(d.length<10)return "";if(d.length<=11)d="55"+d;return "https://wa.me/"+d}
function pinIcon(c){return L.divIcon({className:"pin",html:'<svg viewBox="0 0 24 32" width="30" height="40"><path d="M12 1C5.9 1 1 5.9 1 12c0 8.5 11 19 11 19s11-10.5 11-19C23 5.9 18.1 1 12 1z" fill="'+c+'" stroke="#14213d" stroke-width="1.6"/><circle cx="12" cy="12" r="4.2" fill="#fff"/></svg>',iconSize:[30,40],iconAnchor:[15,40],popupAnchor:[0,-36]})}

function importar(f){
  if(!f)return;
  var ext=f.name.split(".").pop().toLowerCase();
  f.arrayBuffer().then(function(buf){
    var rows,ws;
    if(ext==="xlsx"||ext==="xls"){
      if(!window.XLSX){impMsg="A leitura de .xlsx não carregou. Salve a planilha como .csv e tente de novo.";return render()}
      var wb=XLSX.read(buf,{type:"array"});ws=wb.Sheets[wb.SheetNames[0]];
    }else{
      var t;try{t=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){t=new TextDecoder("windows-1252").decode(buf)}
      t=t.replace(/^\uFEFF/,"");
      if(window.XLSX){var w2=XLSX.read(t,{type:"string"});ws=w2.Sheets[w2.SheetNames[0]]}
      else rows=t.split(/\r?\n/).filter(Boolean).map(function(l){return l.split(l.indexOf(";")>-1?";":",")});
    }
    if(ws)rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
    var norm=function(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"")};
    var A={nome:"nome",local:"nome",ponto:"nome",tipo:"tipo",categoria:"tipo",bairro:"bairro",endereco:"endereco",rua:"endereco",logradouro:"endereco",lat:"lat",latitude:"lat",lng:"lng",lon:"lng",long:"lng",longitude:"lng",coordenadas:"coord",coordenada:"coord",coords:"coord",contato:"contato",telefone:"contato",tel:"contato",whatsapp:"contato",fone:"contato",obs:"obs",observacao:"obs",observacoes:"obs",regional:"regional",regiao:"regional"};
    var hd=(rows[0]||[]).map(function(h){return A[norm(h)]||""});
    if(hd.indexOf("nome")<0){impMsg='Não encontrei a coluna "nome" na primeira linha da planilha.';return render()}
    var ok=0,sem=0,arr=[];
    rows.slice(1).forEach(function(r){
      var o={};hd.forEach(function(k,i){if(k)o[k]=String(r[i]==null?"":r[i]).trim()});
      if(!o.nome)return;
      var a=num(o.lat),b=num(o.lng),ll=okLL(a,b)?[a,b]:parseLL(o.coord);
      var tp=Object.keys(TIPOS).filter(function(t){return norm(t)===norm(o.tipo||"")})[0]||"Outro";
      arr.push({nome:o.nome,tipo:tp,regional:regFrom(o.regional),bairro:o.bairro||"",endereco:o.endereco||"",lat:ll?ll[0]:null,lng:ll?ll[1]:null,contato:o.contato||"",obs:o.obs||""});
      ok++;if(!ll)sem++});
    return sbImport(arr,ok,sem);
  }).catch(function(){impMsg="Não consegui ler esse arquivo.";render()})}

function isCoord(){return !!ME&&ME.papel==="coordenador"}
function errMsg(e){var m={"auth/invalid-credential":"e-mail ou senha incorretos","auth/invalid-email":"e-mail inv\u00e1lido","auth/email-already-in-use":"este e-mail j\u00e1 tem conta","auth/weak-password":"a senha precisa ter 6 caracteres ou mais","auth/too-many-requests":"muitas tentativas, aguarde um pouco","auth/user-not-found":"e-mail ou senha incorretos","auth/wrong-password":"e-mail ou senha incorretos","permission-denied":"sem permiss\u00e3o para esta a\u00e7\u00e3o"};return m[e.code]||e.message}
function col(n){return db.collection(n)}
async function readCol(n){var r=await col(n).get();return r.docs.map(function(d){var o=d.data();o.id=d.id;return o})}
function byNome(a,b){return String(a.nome||"").localeCompare(String(b.nome||""))}
function byTime(a,b){return (a.criado_em||0)-(b.criado_em||0)}
function sair(){return fa.signOut().then(function(){ME=null;S={cabos:[],visitas:[],locais:[],acessos:[]};render()})}
async function loadMe(){
  var u=fa.currentUser;if(!u){ME=null;return}
  var d=await col("perfis").doc(u.uid).get();
  if(!d.exists){
    var base={email:u.email,nome:String(u.email).split("@")[0],criado_em:Date.now()},first=false;
    try{var c=await col("config").doc("admin").get();
      if(!c.exists){var b=db.batch();b.set(col("config").doc("admin"),{uid:u.uid});b.set(col("perfis").doc(u.uid),Object.assign({papel:"coordenador"},base));await b.commit();first=true}}catch(e){}
    if(!first)await col("perfis").doc(u.uid).set(Object.assign({papel:"pendente"},base));
    d=await col("perfis").doc(u.uid).get()}
  var p=d.data();ME={id:u.uid,email:u.email,nome:p.nome||u.email,papel:p.papel||"pendente",foto:p.foto||""}}
async function loadAll(){
  if(!ME||(ME.papel!=="coordenador"&&ME.papel!=="cabo"))return false;
  var r;
  try{r=await Promise.all([readCol("cabos"),readCol("locais"),readCol("visitas"),isCoord()?readCol("perfis"):Promise.resolve([])])}
  catch(e){toast("Erro ao carregar os dados: "+errMsg(e));return false}
  var ns={cabos:r[0].sort(byNome),locais:r[1].sort(byNome),visitas:r[2].sort(byTime),acessos:r[3].sort(byTime)};
  var ch=JSON.stringify(ns)!==JSON.stringify(S);S=ns;return ch}
async function dbDo(p,msg){
  try{await p}catch(e){toast("Erro: "+errMsg(e));return false}
  await loadAll();if(msg)toast(msg);render();return true}

async function sbImport(arr,ok,sem){
  try{for(var i=0;i<arr.length;i+=400){var b=db.batch();
    arr.slice(i,i+400).forEach(function(a){b.set(col("locais").doc(),Object.assign({geofail:false,criado_por:ME.id,criado_em:Date.now()},a))});
    await b.commit()}}
  catch(e){impMsg="Erro ao salvar: "+errMsg(e);render();return}
  await loadAll();
  impMsg=ok+" locais importados"+(sem?". Localizando "+sem+" endere\u00e7os no mapa...":".");render();geocodeAll()}

function pause(ms){return new Promise(function(r){setTimeout(r,ms)})}
function limpaEnd(e){return String(e||"").replace(/^r\.?\s+/i,"Rua ").replace(/^av\.?\s+/i,"Avenida ").replace(/^trav\.?\s+/i,"Travessa ").replace(/^al\.?\s+/i,"Alameda ").replace(/^est\.?\s+/i,"Estrada ").replace(/^rod\.?\s+/i,"Rodovia ").replace(/\bn[\u00ba\u00b0o]\.?\s*(?=\d)/gi,"").trim()}
async function cepInfo(c){try{var r=await fetch("https://brasilapi.com.br/api/cep/v2/"+c);if(!r.ok)return null;return await r.json()}catch(e){return null}}
async function geoOne(l){
  var end=limpaEnd(l.endereco),bai=String(l.bairro||"").trim(),cm=end.match(/\b(\d{5})-?(\d{3})\b/),cep=cm?cm[1]+cm[2]:"";
  if(cm)end=end.replace(cm[0],"").replace(/[,\s-]+$/,"").trim();
  var cid=(end.match(/contagem|ibirit[\u00e9e]|m[\u00e1a]rio campos|sarzedo|esmeraldas|igarap[\u00e9e]|juatuba|belo horizonte/i)||["Betim"])[0];
  var rua=end.split(",")[0].replace(/\s+\d+\S*$/,"").trim(),nm=(end.replace(rua,"").match(/\b(\d{1,5})\b/)||[])[1]||"";
  var enc=encodeURIComponent,base="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&",uf="&state=Minas%20Gerais";
  var hit=async function(qs){try{var r=await fetch(base+qs),j=await r.json();return j&&j[0]?{lat:+j[0].lat,lng:+j[0].lon}:null}catch(e){return null}};
  var r;
  if(rua){
    r=await hit("street="+enc((nm?nm+" ":"")+rua)+"&city="+enc(cid)+uf);if(r)return{lat:r.lat,lng:r.lng,aprox:false};await pause(1100);
    r=await hit("q="+enc(end+(bai?", "+bai:"")+", "+cid+", MG, Brasil"));if(r)return{lat:r.lat,lng:r.lng,aprox:false};await pause(1100)}
  if(cep){
    var ci=await cepInfo(cep),c=ci&&ci.location&&ci.location.coordinates;
    if(c&&c.latitude!=null&&c.longitude!=null)return{lat:+c.latitude,lng:+c.longitude,aprox:true};
    if(ci&&ci.street){r=await hit("q="+enc(ci.street+", "+(ci.neighborhood||bai)+", "+(ci.city||cid)+", MG, Brasil"));if(r)return{lat:r.lat,lng:r.lng,aprox:true};await pause(1100)}}
  if(rua){r=await hit("street="+enc(rua)+"&city="+enc(cid)+uf);if(r)return{lat:r.lat,lng:r.lng,aprox:true};await pause(1100)}
  if(bai){r=await hit("q="+enc(bai+", "+cid+", MG, Brasil"));if(r)return{lat:r.lat,lng:r.lng,aprox:true}}
  return null}
async function geocodeAll(){
  if(geoBusy||!isCoord())return;
  var q=S.locais.filter(function(l){return !hasLL(l)&&(l.endereco||l.bairro)&&!l.geofail});
  if(!q.length)return;
  geoBusy=true;var ok=0,aprox=0;
  for(var k=0;k<q.length;k++){
    var m=$("#mapmsg")||$("#lm");if(m)m.textContent="Localizando endere\u00e7os... "+(k+1)+" de "+q.length;
    var f=null;try{f=await geoOne(q[k])}catch(e){f=null}
    try{await col("locais").doc(q[k].id).update(f?{lat:f.lat,lng:f.lng,aprox:f.aprox}:{geofail:true})}catch(e){}
    if(f){ok++;if(f.aprox)aprox++}}
  geoBusy=false;await loadAll();
  impMsg=ok+" de "+q.length+" endere\u00e7os localizados"+(aprox?" ("+aprox+" de forma aproximada)":"")+(ok<q.length?". Para os demais use Editar na aba Locais.":".");
  render()}

function ico(n){var P={visita:'<path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',mapa:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',locais:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',equipe:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M17 4.5a3.5 3.5 0 0 1 0 7M22 20a6 6 0 0 0-4-5.6"/>',inicio:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',busca:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',rel:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',chev:'<path d="M9 6l6 6-6 6"/>'};
  return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(P[n]||"")+'</svg>'}
function fold(t){return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function hdr(){var a=$("#av");if(!a)return;a.hidden=!ME;if(ME)a.innerHTML=ME.foto?'<img src="'+ME.foto+'" alt="">':esc(String(ME.nome||"?").charAt(0).toUpperCase())}
function indicar(){
  var d={title:"Rota Patriota",text:"Rota Patriota: app para organizar cabos eleitorais, visitas e rotas no Waze. Acesse:",url:location.origin+location.pathname};
  if(navigator.share){navigator.share(d).catch(function(){})}
  else window.open("https://wa.me/?text="+encodeURIComponent(d.text+" "+d.url),"_blank")}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dpr=e;var b=document.getElementById("inst");if(b)b.hidden=false});
function redimensiona(file,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();
    im.onload=function(){var m=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=160;
      c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);cb(c.toDataURL("image/jpeg",.8))};
    im.onerror=function(){toast("N\u00e3o consegui ler a imagem")};im.src=r.result};
  r.readAsDataURL(file)}

function painel(){
  var h=hoje(),hj=per==="hoje",vs=hj?S.visitas.filter(function(v){return v.data===h}):S.visitas;
  var meta=sum(S.cabos,"meta"),feito=sum(vs,"contatos"),pct=hj&&meta?Math.min(100,Math.round(feito/meta*100)):0;
  var fav=sum(vs,"fav"),ind=sum(vs,"ind"),con=sum(vs,"con");
  var o='<h1>Ol\u00e1, '+esc(String(ME.nome||"").split(" ")[0])+'</h1>';
  o+='<div class="seg"><button data-per="hoje" aria-pressed="'+hj+'">Hoje</button><button data-per="total" aria-pressed="'+!hj+'">Total</button></div>';
  o+='<div class="search"><button class="sb" data-go="locais" data-focus="1">'+ico("busca")+'<span>Buscar local ou endere\u00e7o</span></button><button class="pill" data-go="registrar">Visita</button></div>';
  var rec=S.visitas.slice().reverse().slice(0,3);
  if(rec.length)o+='<div class="list">'+rec.map(function(v){var c=S.cabos.find(function(x){return x.id===v.cabo});
    return '<button class="row2" data-go="registrar"><span class="sq">'+ico("rel")+'</span><span class="t"><b>'+esc(c?c.nome:"Cabo removido")+'</b><span>'+esc(v.bairro||"Sem bairro")+' \u00b7 '+v.contatos+' contatos</span></span>'+ico("chev")+'</button>'}).join("")+'</div>';
  o+='<h2>Atalhos</h2><div class="circ">'+[["registrar","Visita","visita"],["mapa","Mapa","mapa"],["locais","Locais","locais"],["equipe","Equipe","equipe"]].map(function(a){return '<button data-go="'+a[0]+'"><i>'+ico(a[2])+'</i>'+a[1]+'</button>'}).join("")+'</div>';
  o+='<h2>Resultado da equipe</h2><div class="scroller">'+
   '<div class="card2" style="background:linear-gradient(135deg,#006b2b,#009c3b)"><div>Contatos '+(hj?"hoje":"no total")+'</div><div><div class="n" style="color:#ffdf00">'+feito+'</div>'+(hj?'<div>de '+meta+' da meta</div><div class="bar"><i style="width:'+pct+'%"></i></div>':'<div>em '+vs.length+' visitas</div>')+'</div></div>'+
   '<div class="card2" style="background:linear-gradient(135deg,#00205f,#1d4fbf)"><div>Favor\u00e1veis</div><div><div class="n">'+fav+'</div><div>'+(feito?Math.round(fav/feito*100):0)+'% dos contatos</div></div></div>'+
   '<div class="card2" style="background:#ffdf00;color:#002776"><div>Indecisos</div><div><div class="n">'+ind+'</div><div>'+con+' contr\u00e1rios</div></div></div></div>';
  if(!S.cabos.length)return o+'<h2>Comece pela equipe</h2><div class="empty">Nenhum cabo cadastrado ainda.<br><button class="btn alt coord-only" id="goeq">Cadastrar o primeiro cabo</button></div>';
  o+='<h2>Ranking '+(hj?"de hoje":"geral")+'</h2>';
  var rk=S.cabos.map(function(c){var f=sum(vs.filter(function(v){return v.cabo===c.id}),"contatos"),alvo=hj?c.meta:0;return{c:c,f:f,p:alvo?Math.min(100,Math.round(f/alvo*100)):0}}).sort(function(a,b){return b.f-a.f});
  o+=rk.map(function(r,i){return '<div class="item"><div class="top"><strong>'+(i+1)+'. '+esc(r.c.nome)+'</strong><span>'+r.f+(hj?' / '+r.c.meta:'')+'</span></div><div class="meta">'+esc(r.c.bairro)+'</div>'+(hj?'<div class="bar"><i style="width:'+r.p+'%"></i></div>':'')+'</div>'}).join("");
  var bm={};S.visitas.forEach(function(v){var b=v.bairro||"Sem bairro";bm[b]=bm[b]||{c:0,f:0};bm[b].c+=+v.contatos||0;bm[b].f+=+v.fav||0});
  var bl=Object.keys(bm).sort(function(a,b){return bm[b].c-bm[a].c}),mx=bl.length?bm[bl[0]].c:1;
  o+='<h2>Cobertura por bairro</h2>';
  o+=bl.length?bl.map(function(b){return '<div class="item"><div class="top"><strong>'+esc(b)+'</strong><span>'+bm[b].c+' contatos</span></div><div class="meta">'+bm[b].f+' favor\u00e1veis</div><div class="bar"><i style="width:'+Math.round(bm[b].c/mx*100)+'%"></i></div></div>'}).join(""):'<div class="empty">Registre a primeira visita para ver a cobertura.</div>';
  return o}

function rodape(){
  var ini=esc(String(ME.nome||"?").charAt(0).toUpperCase()),av=ME.foto?'<img src="'+ME.foto+'" alt="">':ini;
  var h='<h2>Minha conta</h2><div class="item"><div class="prof"><span class="av big">'+av+'</span><div><b>'+esc(ME.nome)+'</b><div class="meta">'+esc(ME.email)+' \u00b7 '+esc(ME.papel)+'</div></div></div>'+
   '<label for="pnome">Meu nome</label><input id="pnome" value="'+esc(ME.nome)+'" maxlength="60"><button class="btn alt" id="pn">Salvar nome</button>'+
   '<label for="pf">Foto de perfil</label><input id="pf" type="file" accept="image/*">'+
   '<button class="btn alt" id="shr2">Indicar o app</button><button class="btn alt" id="inst" hidden>Instalar no celular</button>'+
   '<div class="meta" style="margin-top:8px">No iPhone: toque em Compartilhar e depois em Adicionar \u00e0 Tela de In\u00edcio.</div><button class="link" id="out">Sair</button></div>';
  if(isCoord())h+='<h2>Acessos</h2>'+(S.acessos||[]).map(function(a){
    var b=a.id===ME.id?'<div class="meta">Voc\u00ea</div>':
     (a.papel!=="cabo"?'<button class="link" style="color:var(--teal)" data-pap="cabo" data-uid="'+a.id+'">Liberar como cabo</button> &nbsp; ':'')+
     (a.papel!=="coordenador"?'<button class="link" style="color:var(--blue)" data-pap="coordenador" data-uid="'+a.id+'">Tornar coordenador</button> &nbsp; ':'')+
     (a.papel!=="pendente"?'<button class="link" data-pap="pendente" data-uid="'+a.id+'">Bloquear</button>':'');
    var nm=a.nome||a.email;
    return '<div class="item"><div class="top"><span style="display:flex;align-items:center;gap:10px;min-width:0"><span class="av sm">'+(a.foto?'<img src="'+a.foto+'" alt="">':esc(String(nm).charAt(0).toUpperCase()))+'</span><span style="min-width:0"><strong>'+esc(nm)+'</strong><div class="meta">'+esc(a.email)+'</div></span></span><span class="tag">'+esc(a.papel)+'</span></div>'+b+'</div>'}).join("");
  return h}

function editLocal(id){
  var l=S.locais.find(function(x){return x.id===id});if(!l)return;
  var ov=document.createElement("div");ov.className="ov";
  var opt=function(arr,v){return arr.map(function(t){return '<option'+(t===v?' selected':'')+'>'+esc(t)+'</option>'}).join("")};
  ov.innerHTML='<div class="sheet" role="dialog" aria-label="Editar local"><h2 style="margin-top:0">Editar local</h2>'+
   '<label for="e_n">Nome</label><input id="e_n" value="'+esc(l.nome)+'">'+
   '<label for="e_t">Tipo</label><select id="e_t">'+opt(Object.keys(TIPOS),l.tipo)+'</select>'+
   '<label for="e_r">Regional</label><select id="e_r"><option value="">Autom\u00e1tica (pelo bairro ou coordenadas)</option>'+opt(REGS.map(function(r){return r[0]}),l.regional)+'</select>'+
   '<label for="e_b">Bairro</label><input id="e_b" value="'+esc(l.bairro)+'">'+
   '<label for="e_e">Endere\u00e7o</label><input id="e_e" value="'+esc(l.endereco)+'">'+
   '<label for="e_c">Coordenadas (latitude, longitude)</label><input id="e_c" value="'+(hasLL(l)?l.lat+", "+l.lng:"")+'"><div class="meta">Se mudar o endere\u00e7o, deixe as coordenadas como est\u00e3o: o app localiza de novo sozinho.</div>'+
   '<label for="e_k">Contato</label><input id="e_k" value="'+esc(l.contato)+'">'+
   '<label for="e_o">Observa\u00e7\u00f5es</label><textarea id="e_o" rows="2">'+esc(l.obs)+'</textarea>'+
   '<button class="btn" id="es">Salvar altera\u00e7\u00f5es</button><button class="btn alt" id="ec">Cancelar</button></div>';
  document.body.appendChild(ov);
  var q=function(i){return document.getElementById(i)},fecha=function(){ov.remove()};
  ov.onclick=function(e){if(e.target===ov)fecha()};q("ec").onclick=fecha;
  q("es").onclick=async function(){
    var nome=q("e_n").value.trim();if(!nome){toast("Informe o nome do local");return}
    var d={nome:nome,tipo:q("e_t").value,regional:q("e_r").value,bairro:q("e_b").value.trim(),endereco:q("e_e").value.trim(),contato:q("e_k").value.trim(),obs:q("e_o").value.trim()};
    var cs=q("e_c").value.trim(),orig=hasLL(l)?l.lat+", "+l.lng:"";
    if(cs!==orig){
      if(cs){var ll=parseLL(cs);if(!ll){toast("Coordenadas inv\u00e1lidas");return}d.lat=ll[0];d.lng=ll[1]}else{d.lat=null;d.lng=null}
      d.aprox=false;d.geofail=false}
    else if(d.endereco!==(l.endereco||"")||d.bairro!==(l.bairro||"")){d.lat=null;d.lng=null;d.aprox=false;d.geofail=false}
    var ok=await dbDo(col("locais").doc(id).update(d),"Local atualizado");
    if(ok){fecha();geocodeAll()}}}

async function boot(){
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
  $("#shr").onclick=indicar;$("#av").onclick=function(){if(ME){tab="equipe";render();scrollTo(0,0)}};
  if(!window.firebase||CFG.apiKey.indexOf("COLE")===0){
    document.querySelector("nav").hidden=true;
    $("#app").innerHTML='<h1>Falta configurar</h1><p class="sub">Abra o arquivo index.html e preencha a configura\u00e7\u00e3o do Firebase no come\u00e7o do script (veja o passo a passo).</p>';return}
  firebase.initializeApp(CFG);fa=firebase.auth();db=firebase.firestore();
  await new Promise(function(res){var un=fa.onAuthStateChanged(function(){un();res()})});
  try{await loadMe();await loadAll()}catch(e){toast(errMsg(e))}
  render()}

function render(){
  var nv=document.querySelector("nav");hdr();
  if(!ME||(ME.papel!=="coordenador"&&ME.papel!=="cabo")){nv.hidden=true;return gate()}
  nv.hidden=false;document.body.classList.toggle("cabo",!isCoord());
  tabs();
  $("#app").innerHTML=tab==="painel"?painel():tab==="mapa"?mapa():tab==="locais"?locais():tab==="registrar"?registrar():equipe();bind2();
  bind();
}

boot();
